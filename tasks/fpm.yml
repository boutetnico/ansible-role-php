---
- name: Ensure php-fpm starts on boot
  ansible.builtin.service:
    enabled: true
    name: "php{{ php_version }}-fpm"

- name: Copy php.ini (fpm)
  ansible.builtin.template:
    dest: "/etc/php/{{ php_version }}/fpm/php.ini"
    group: root
    mode: "0644"
    owner: root
    src: etc/php/php.ini.j2
  notify: Reload php-fpm

- name: Ensure pool.d dir exists
  ansible.builtin.file:
    group: root
    mode: "0755"
    owner: root
    path: "/etc/php/{{ php_version }}/fpm/pool.d"
    state: directory

- name: Remove default www.conf pool if not overridden
  ansible.builtin.file:
    path: "/etc/php/{{ php_version }}/fpm/pool.d/www.conf"
    state: absent
  when: php_fpm_pools | selectattr('name', 'equalto', 'www') | list | length == 0
  notify: Reload php-fpm

- name: Setup fpm pools
  ansible.builtin.template:
    dest: "/etc/php/{{ php_version }}/fpm/pool.d/{{ item.name }}.conf"
    group: root
    mode: "0644"
    owner: root
    src: etc/php/fpm/pool.d/pool.conf.j2
  loop: "{{ php_fpm_pools }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload php-fpm

# Debian's php-fpm logrotate covers one exact path, so pool slowlogs would never rotate.
- name: Manage logrotate for pool slowlogs
  ansible.builtin.template:
    dest: /etc/logrotate.d/php{{ php_version }}-fpm-slowlog
    group: root
    mode: "0644"
    owner: root
    src: etc/logrotate.d/php-fpm-slowlog.j2
  when:
    - php_fpm_slowlog_logrotate
    - php_fpm_pools | selectattr('slowlog', 'defined') | list | length > 0

- name: Remove logrotate for pool slowlogs when none are configured
  ansible.builtin.file:
    path: /etc/logrotate.d/php{{ php_version }}-fpm-slowlog
    state: absent
  when: not php_fpm_slowlog_logrotate or
        php_fpm_pools | selectattr('slowlog', 'defined') | list | length == 0

- name: Set php-fpm process control timeout
  community.general.ini_file:
    create: true
    group: root
    mode: "0644"
    option: process_control_timeout
    owner: root
    path: "/etc/php/{{ php_version }}/fpm/php-fpm.conf"
    section: global
    value: "{{ php_fpm_process_control_timeout }}"
  notify: Reload php-fpm

- name: Set php-fpm log level
  community.general.ini_file:
    create: true
    group: root
    mode: "0644"
    option: log_level
    owner: root
    path: "/etc/php/{{ php_version }}/fpm/php-fpm.conf"
    section: global
    value: "{{ php_fpm_log_level }}"
  notify: Reload php-fpm
