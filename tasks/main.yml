---
- name: Install dependencies
  ansible.builtin.apt:
    name: "{{ php_dependencies }}"
    state: present
    update_cache: true

- name: Ensure python3-debian is installed
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Configure Sury APT repository (Debian)
  ansible.builtin.deb822_repository:
    name: sury
    uris: https://packages.sury.org/php
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [main]
    types: [deb, deb-src]
    signed_by: https://packages.sury.org/php/apt.gpg
  when: ansible_facts['distribution'] == "Debian"

- name: Pin Sury as preferred source for php packages (Debian)
  ansible.builtin.copy:
    content: |
      Package: *
      Pin: origin "packages.sury.org"
      Pin-Priority: 600
    dest: /etc/apt/preferences.d/sury.pref
    group: root
    mode: "0644"
    owner: root
  when:
    - ansible_facts['distribution'] == "Debian"
    - php_pin_sury | bool

- name: Ensure software-properties-common installed (Ubuntu)
  ansible.builtin.apt:
    name: software-properties-common
    state: present
  when: ansible_facts['distribution'] == "Ubuntu"

# key vendored in files/ondrej-php.asc because keyserver.ubuntu.com responses
# are not byte-stable, which breaks idempotence when passing a URL to signed_by
# fingerprint B8DC7E53946656EFBCE4C1DD71DAEAAB4AD4CAB6 (Launchpad PPA for Ondřej Surý)
- name: Add ondrej/php PPA (Ubuntu)
  ansible.builtin.deb822_repository:
    components: [main]
    name: ondrej-php
    signed_by: "{{ lookup('ansible.builtin.file', 'ondrej-php.asc') }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    types: [deb]
    uris: https://ppa.launchpadcontent.net/ondrej/php/ubuntu
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Install php
  ansible.builtin.apt:
    name: "{{ php_packages + php_extra_packages }}"
    state: "{{ php_packages_state }}"
    update_cache: true
  notify: Reload php-fpm

# Only created when missing; other handlers put a URI in save_path, not a path.
- name: Check the session save path
  ansible.builtin.stat:
    path: "{{ php_session_save_path }}"
  register: php_session_save_dir
  when:
    - php_session_save_handler == 'files'
    - php_session_save_path | length > 0

- name: Ensure the session save path exists
  ansible.builtin.file:
    group: root
    mode: "1733"
    owner: root
    path: "{{ php_session_save_path }}"
    state: directory
  when:
    - php_session_save_handler == 'files'
    - php_session_save_path | length > 0
    - not (php_session_save_dir.stat.exists | default(false))

- name: Setup php.ini for php-cli
  ansible.builtin.template:
    dest: "/etc/php/{{ php_version }}/cli/php.ini"
    group: root
    mode: "0644"
    owner: root
    src: etc/php/php.ini.j2

- name: Check if php-fpm is installed
  ansible.builtin.stat:
    path: "/etc/php/{{ php_version }}/fpm"
  register: php_fpm_directory

- name: Include php-fpm tasks
  ansible.builtin.import_tasks: fpm.yml
  when: php_fpm_directory.stat.isdir | default(false)

- name: Setup extensions
  ansible.builtin.import_tasks: extensions.yml

- name: Setup systemd config
  ansible.builtin.import_tasks: systemd.yml
  when: php_fpm_directory.stat.isdir | default(false)
