---
- name: Converge
  hosts: all

  roles:
    - role: boutetnico.php
      php_fpm_pools:
        - name: www
          user: www-data
          group: www-data
          listen: "/run/php/php{{ php_version }}-fpm.sock"
          pm: dynamic
          pm_max_children: 5
          pm_start_servers: 2
          pm_min_spare_servers: 1
          pm_max_spare_servers: 3
          request_slowlog_timeout: 10s
          slowlog: "/var/log/php{{ php_version }}-fpm-www-slow.log"
          php_admin_values:
            disable_functions: exec,shell_exec
            open_basedir: /var/www/:/tmp/
          php_admin_flags:
            allow_url_fopen: "Off"
      php_extensions:
        - name: testmod_cli
          sapi: cli
          config: {}
        - name: testmod_all
          config: {}
      php_extra_ini:
        realpath_cache_size: 4096K
        realpath_cache_ttl: 600
        mysqlnd.net_cmd_buffer_size: 16384
        zend.detect_unicode: true
        allow_url_fopen: false
        zend.multibyte: "On"
        zend.script_encoding: "Off"
